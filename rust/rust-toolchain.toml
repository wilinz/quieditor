# Pin an exact version rather than a channel so builds are reproducible.
# `native_toolchain_rust` rejects `stable` / `beta` / `nightly` for this reason.
#
# Keep this file and `ffi/rust-toolchain.toml` in sync: the build hook reads the
# one next to the crate it builds, while a bare `cargo test` at the workspace
# root reads this one.
#
# The engine keeps one too, in its own repository, and neither of these is it.
# When the hook builds, the toolchain comes from here and compiles the engine
# with it — so it is this pair that has to agree with each other, and with the
# toolchain the engine's CI builds the WebAssembly module with.
[toolchain]
channel = "1.95.0"
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",

  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",

  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",

  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",

  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
