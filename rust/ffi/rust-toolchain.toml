# `native_toolchain_rust` reads this file from the crate directory, so it has to
# live here as well as at the workspace root. Keep the two in sync.
#
# An exact version, not a channel: the build hook rejects `stable` / `beta` /
# `nightly` because they make builds unreproducible.
[toolchain]
channel = "1.95.0"
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",

  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",

  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",

  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",

  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
