# `native_toolchain_rust` reads this file from the crate directory, so it has to
# live here as well as at the workspace root. Keep the two in sync.
#
# An exact version, not a channel: the build hook rejects `stable` / `beta` /
# `nightly` because they make builds unreproducible.
#
# The engine has a toolchain file of its own, in its own repository, and it is
# not this one. That is not an inconsistency to remove: when the hook builds,
# rustup picks the toolchain from here and it compiles the engine too, so these
# two are what has to agree. A compiler difference between the one CI builds the
# WebAssembly module with and the one this builds the library with is a
# difference nothing would report.
[toolchain]
channel = "1.95.0"
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",

  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",

  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",

  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",

  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
