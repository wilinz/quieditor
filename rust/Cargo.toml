[workspace]
resolver = "2"
members = ["ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/reqable/re-editor"

[workspace.dependencies]
# The engine's C ABI, and the WebAssembly module built from the same source,
# fetched and pinned to the tag. A path would need a second checkout beside
# every clone of this repository, and a branch would let someone else's push
# change what this ships. This workspace produces a compiled artifact — which is
# why Cargo.lock is kept — and a dependency that moves underneath it is the one
# thing that would make the lock a fiction.
#
# The engine crate comes with it. Nothing here names `quieditor_engine` any
# more: the crate that needs it is the shim, and the shim lives beside it now.
quieditor_ffi = { git = "https://github.com/wilinz/quieditor_engine", tag = "v0.4.0" }

[profile.release]
# The editor hands this library whole documents to chew on, so optimise for
# throughput even at the cost of build time.
lto = true
codegen-units = 1
